
services:
  - type: web
    name: climate-hazard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: climate_hazards
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: climate-hazard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
